name: Publish to PyPI

# Publishes a GitHub Release to PyPI via Trusted Publishing (OIDC):
# no API token is stored anywhere — PyPI trusts this exact combination of
# repository, workflow filename and environment, and mints short-lived
# credentials per run. One-time setup lives on the PyPI side:
# pypi.org → Account settings → Publishing → pending publisher with
#   owner ZengZichao · repository ProkName · workflow publish.yml ·
#   environment pypi · project name prokname
# Releasing is then: draft a release for a `vX.Y.Z` tag → publish it →
# this workflow builds that tag and uploads the artifacts.

on:
  release:
    types: [published]
  # Manual escape hatch: re-publish an existing tag after a failed upload
  # (e.g. the trusted publisher was misconfigured on the first attempt)
  # without re-publishing the GitHub Release. Pass the tag, e.g. v0.1.0.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and publish (must match the wheel version)'
        required: true
        type: string

# Nothing at workflow level; the publish job grants exactly what OIDC needs.
permissions: {}

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    env:
      # One source for both triggers: the release's tag, or the manual input.
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        # Build the commit the release tag points at, not whatever main is at
        # publish time — the released tarball must be reproducible from the tag.
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build distributions
        # Same command as the CI wheel-smoke job, plus the sdist PyPI serves
        # to `pip install prokname` on platforms without a matching wheel.
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify version matches the release tag
        # A wheel whose metadata contradicts the tag would publish under a
        # name PyPI assigns from metadata — fail here instead.
        run: |
          wheel_version=$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*\.whl/\1/')
          echo "tag=$TAG wheel=$wheel_version"
          [ "v$wheel_version" = "$TAG" ] || {
            echo "::error::wheel version $wheel_version does not match tag $TAG"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    # The environment name is part of the trusted-publisher identity PyPI
    # checks; it must stay exactly `pypi`.
    environment: pypi
    permissions:
      # The single credential trusted publishing uses: a run-scoped OIDC
      # token exchanged on PyPI's side. No secrets are configured for this.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password` input on purpose: with only `id-token: write` the
        # action authenticates via OIDC and also uploads PEP 740 attestations.
        # If this step fails with "the upload failed" before the first
        # release, the pending publisher on PyPI is missing or mismatches —
        # compare owner/repo/workflow/environment/name against the block
        # comment at the top, then re-run failed jobs (artifacts survive).
