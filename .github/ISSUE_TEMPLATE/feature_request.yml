name: Feature request / 功能建议
description: Suggest an improvement. 提出改进建议。
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: >-
        What naming or verification workflow is blocked today? 当前哪个命名或
        校验流程受阻？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
      description: >-
        Concrete CLI behavior or output. If it touches ICNP / SeqCode rules,
        cite the rule. 具体的 CLI 行为或输出；涉及 ICNP / SeqCode 规则请注明
        规则出处。
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check / 范围确认
      options:
        - label: >-
            This belongs in ProkName (not ProkName-Studio or the corpus
            build). 属于 ProkName 本体而非 Studio 或语料构建。
          required: true
