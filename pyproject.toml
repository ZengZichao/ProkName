[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prokname"
# Version is NOT declared here: it is generated at build
# time from the single source of truth in src/prokname/__init__.py (see
# [tool.hatch.version] below), so a release cannot ship a wheel whose
# metadata contradicts `prokname --version` or an export fingerprint.
dynamic = ["version"]
description = "Prokaryotic nomenclature assistant: deterministic etymology-driven name generation, gender agreement validation, dual-code (ICNP/SeqCode) routing"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Zichao Zeng", email = "zengzichao@sjtu.edu.cn" },
]
keywords = ["nomenclature", "taxonomy", "ICNP", "SeqCode", "LPSN", "prokaryotes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "vcrpy>=6.0",
    "ruff>=0.6",
    # scipy and pandas are NOT runtime dependencies and must stay out of
    # `dependencies`. They are here because tests/test_metrics_intervals.py
    # cross-checks the Clopper–Pearson / bootstrap intervals against
    # scipy.stats, and tests/test_storage.py reads the exported CSV back with
    # pandas. Both modules `importorskip`, so without them 29 tests used to
    # vanish silently from a green CI run — a gate that is skipped is not a
    # gate. Pinning them in `dev` makes the skip unconditional-failure instead
    # of invisible.
    "scipy>=1.11",
    "pandas>=2.0",
    # httpx is a runtime dependency of the *optional* `online` extra, but
    # `tests/test_api_fixtures.py` replays the recorded GNA captures through the
    # real adapter, and that adapter imports httpx. With `.[dev]` only, the CI
    # matrix collected the test and then died with ModuleNotFoundError. It is
    # pinned here for the same reason as scipy: a gate that cannot run is not a
    # gate, and this one exists to prove the live captures still drive the code
    # path they were recorded from.
    "httpx>=0.27",
]
# Optional `--online` capability of `prokname check` (kept out of the core
# runtime on purpose: the two runtime dependencies stay typer + rich).
# - lpsn: official DSMZ LPSN API client (LeibnizDSMZ/lpsn-api, MIT); pulls
#   python-keycloak, requests, urllib3 transitively.
# - httpx: GNA GNverifier reference-source queries (dedup/gna.py).
# - keyring: optional OS-keychain storage for LPSN credentials.
online = [
    "lpsn>=1.0",
    "httpx>=0.27",
    "keyring>=24",
]
# There is no `gui` extra here, and there must not be one again: ProkName Studio
# is a separate project (`prokname-studio`) that depends on this package, rather
# than an optional layer inside it. The dependency runs one way — Studio needs
# the engine, the engine never needs Qt.

[project.scripts]
prokname = "prokname.cli:main"

[project.urls]
Documentation = "https://github.com/ZengZichao/ProkName#readme"
Source = "https://github.com/ZengZichao/ProkName"
Issues = "https://github.com/ZengZichao/ProkName/issues"
Changelog = "https://github.com/ZengZichao/ProkName/blob/main/CHANGELOG.md"

[tool.hatch.version]
# The version lives in src/prokname/__init__.py (`__version__ = "..."`).
# Hatchling reads that one line at build time, so the wheel/sdist metadata can
# never contradict prokname.__version__, `prokname --version` or the version
# stamped into export fingerprints.
path = "src/prokname/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prokname"]
# Everything under src/prokname (including prokname/data and
# prokname/benchmark/data) is packaged automatically; a force-include for
# the same paths would duplicate entries and break the wheel build.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: typer's CLI idiom passes function calls (typer.Option/Argument) as defaults
# E741: single-letter loop variables in existing test/report code
# B905: zip() strictness is enforced by explicit length checks in metrics
# UP042: str-Enum replacement is a design change, not a lint fix
ignore = ["B008", "E741", "B905", "UP042"]

[tool.ruff.lint.per-file-ignores]
# PyInstaller .spec files use builtins (Analysis, EXE, PYZ, COLLECT, BUNDLE)
# injected at build time — ruff doesn't know about them.
"*.spec" = ["F821", "UP009"]

[tool.coverage.run]
source = ["src/prokname"]
